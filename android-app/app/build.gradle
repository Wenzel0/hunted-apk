plugins {
    id 'com.android.application'
}

android {
    namespace 'com.itzwenzel.huntedthreshold'
    compileSdk 34

    defaultConfig {
        applicationId "com.itzwenzel.huntedthreshold"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game's audio / video / pictures are already compressed: store them as they are (faster loading)
    androidResources {
        noCompress 'ogg', 'mp3', 'mp4', 'png', 'webm'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
